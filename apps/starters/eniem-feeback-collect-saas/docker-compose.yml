version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: eniem-feeback-collect-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eniem-feeback-collect-saas
      POSTGRES_USER: eniem-feeback-collect-saas
      POSTGRES_PASSWORD: eniem-feeback-collect-saas-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniem-feeback-collect-saas -d eniem-feeback-collect-saas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
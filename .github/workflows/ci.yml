name: CI

on:
  pull_request:
    branches: [main, quality]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: cp apps/boilerplate/.env.example apps/boilerplate/.env

      - name: Copy starter env files
        run: |
          for dir in apps/starters/*/; do
            if [ -f "$dir/.env.example" ]; then
              cp "$dir/.env.example" "$dir/.env"
            fi
          done

      - run: pnpm turbo build lint typecheck test --filter=...[origin/quality]

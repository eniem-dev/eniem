name: Auto-Tag & Sync Starters

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auto-tag:
    name: Compute & Push Starters Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and create tag
        id: tag
        run: |
          set -euo pipefail

          # Find the most recent starters tag
          PREV_TAG=$(git tag -l 'starters@*' --sort=-v:refname | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous starters tag found — analyzing all commits on main"
            DIFF_REF="$(git rev-list --max-parents=0 HEAD | tail -1)"
            PREV_VERSION="0.0.0"
          else
            echo "Previous tag: $PREV_TAG"
            DIFF_REF="$PREV_TAG"
            PREV_VERSION="${PREV_TAG#starters@}"
          fi

          # Check if any starters files changed
          CHANGED=$(git diff --name-only "$DIFF_REF"..HEAD -- apps/starters/)
          if [ -z "$CHANGED" ]; then
            echo "No starters changes since $DIFF_REF — skipping"
            exit 0
          fi

          echo "Changed starters files:"
          echo "$CHANGED"

          # Get conventional commits scoped to starters
          COMMITS=$(git log "$DIFF_REF"..HEAD --oneline -- apps/starters/)
          if [ -z "$COMMITS" ]; then
            echo "No commits touching starters — skipping"
            exit 0
          fi

          echo "Commits since $DIFF_REF:"
          echo "$COMMITS"

          # Determine bump type from conventional commits
          BUMP="none"
          while IFS= read -r line; do
            msg="${line#* }"  # strip short hash
            if echo "$msg" | grep -qiE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
              BUMP="major"
              break
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              if [ "$BUMP" != "major" ]; then
                BUMP="minor"
              fi
            elif echo "$msg" | grep -qE '^(fix|chore|docs|refactor|style|perf|test|build|ci)(\(.+\))?:'; then
              if [ "$BUMP" = "none" ]; then
                BUMP="patch"
              fi
            fi
          done <<< "$COMMITS"

          if [ "$BUMP" = "none" ]; then
            echo "No conventional commits found — skipping"
            exit 0
          fi

          echo "Bump type: $BUMP"

          # Parse previous version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"

          # Compute new version
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="starters@${MAJOR}.${MINOR}.${PATCH}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Creating tag: $NEW_TAG"

          # Fail if tag already exists
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $NEW_TAG already exists!"
            exit 1
          fi

          # Create and push the tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

          echo "Successfully created and pushed $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  sync:
    name: Extract & Sync Starters
    needs: auto-tag
    if: needs.auto-tag.outputs.new_tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ needs.auto-tag.outputs.new_tag }}"
          PREV_TAG=$(git tag -l 'starters@*' --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..${CURRENT_TAG}" --oneline -- apps/starters/)
          else
            LOG=$(git log "${CURRENT_TAG}" --oneline -- apps/starters/)
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "log<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Rsync starters to temp dir
        run: |
          mkdir -p /tmp/starters
          rsync -a --exclude node_modules --exclude .next --exclude .worktrees --exclude .beads --exclude specs --exclude .claude --exclude .eni --exclude .github apps/starters/ /tmp/starters/

      - name: Generate standalone lock files
        run: |
          for dir in /tmp/starters/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Generating lockfile for $(basename "$dir")"
              (cd "$dir" && pnpm install --lockfile-only)
            fi
          done

      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STARTERS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Clone customer repo
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
        run: git clone git@github.com:eniem-dev/eniem-starters.git /tmp/customer-repo

      - name: Swap .git directory
        run: |
          rm -rf /tmp/starters/.git
          mv /tmp/customer-repo/.git /tmp/starters/.git

      - name: Commit, tag, and push if changes exist
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
        working-directory: /tmp/starters
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          git add -A
          git diff --cached --quiet || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BODY="${{ steps.changelog.outputs.log }}"
            if [ -n "$BODY" ]; then
              git commit -m "release: v${VERSION}" -m "$BODY"
            else
              git commit -m "release: v${VERSION}"
            fi
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push --follow-tags
          )
